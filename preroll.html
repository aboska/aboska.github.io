<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <script src="./js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
    
</head>
<body>
    <h1 class="text-center">Pre Roll Calculator</h1>
    <div class="input-group mb-3">
        <label class="input-group-text" for="inputFile">Upload</label>
        <input type="file" class="form-control" id="fileInput" accept=".kd">
    </div>
    <div class="toast-container position-fixed top-50 start-50 translate-middle p3">
        <div id="copyToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Result</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <div id="toastBody" class="text-center">

                </div>
                <br>
                <btn class="btn btn-primary position-relative start-50 translate-middle-x" id="copyToClipboard">Copy</btn>
            </div>
        </div>
    </div>
    <script src="pitchshiftcompensation.js"></script>
</body>
</html>
