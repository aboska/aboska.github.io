<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <script src="./js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
    
</head>
<body>
    <h1 class="text-center">Pre Roll Calculator</h1>
    <div class="input-group mb-3">
        <label class="input-group-text" for="inputFile">Upload</label>
        <input type="file" class="form-control" id="fileInput" accept=".kd">
    </div>
    <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="resultModalLabel">Result</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="modalBody" style="white-space: pre-wrap; word-break: break-word;"></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="copyToClipboard">Copy</button>
                </div>
            </div>
        </div>
    </div>
    <script src="pitchshiftcompensation.js"></script>
</body>
</html>
